name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain (Swift 6.1, tools-version 6.0).
          - runner: macos-15
            xcode: "16.4"
            ios: true
          # Oldest Xcode 26. Non-default Xcodes on the runner image ship without
          # simulator runtimes, so this entry only runs the macOS tests.
          - runner: macos-26
            xcode: "26.0.1"
            ios: false
          # Newest available.
          - runner: macos-26
            xcode: "26.6"
            ios: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Test (macOS)
        run: swift test
      - name: Build (iOS Simulator)
        if: matrix.ios
        run: |
          xcodebuild build \
            -scheme MiAuth \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  linux:
    name: Linux Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1", "6.2"]
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test
