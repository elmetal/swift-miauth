name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Emit symbol graphs
        run: |
          swift build \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir -Xswiftc .build/symbol-graphs
      - name: Convert documentation
        run: |
          docc convert Sources/MiAuth/MiAuth.docc \
            --fallback-display-name MiAuth \
            --fallback-bundle-identifier io.github.elmetal.swift-miauth \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-path docs \
            --transform-for-static-hosting \
            --hosting-base-path swift-miauth \
            --warnings-as-errors
          printf '<meta http-equiv="refresh" content="0; url=documentation/miauth/">' > docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
